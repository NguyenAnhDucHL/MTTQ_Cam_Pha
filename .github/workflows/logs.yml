name: Get Logs
on: workflow_dispatch
jobs:
  get-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          password: ${{ secrets.VNPT_PASS }}
          port: 22
          script: |
            cd mttq_deploy
            docker-compose logs
