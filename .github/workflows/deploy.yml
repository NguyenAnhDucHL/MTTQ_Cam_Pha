name: Deploy to VNPT VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          password: ${{ secrets.VNPT_PASS }}
          source: "."
          target: "/root/mttq_deploy"
          rm: false
          exclude: ".git,node_modules,.github,backend/database.sqlite,backend/uploads"

      - name: Execute Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          password: ${{ secrets.VNPT_PASS }}
          script: |
            set -e
            cd /root/mttq_deploy/Cong_MTTQ_Cam_Pha_Quan_Tri_3.0 || cd /root/mttq_deploy
            
            echo ">>> Build và khởi động lại Docker containers..."
            docker-compose build
            docker-compose up -d
            
            echo "=== Trạng thái Container ==="
            docker-compose ps
