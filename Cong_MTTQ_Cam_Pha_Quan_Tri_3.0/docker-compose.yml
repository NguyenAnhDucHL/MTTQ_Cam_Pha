version: '3.3'

services:
  frontend:
    image: ghcr.io/nguyenanhduchl/mttq-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 100M

  backend:
    image: ghcr.io/nguyenanhduchl/mttq-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/database.sqlite:/app/database.sqlite
      - ./backend/uploads:/app/uploads
    restart: always
    deploy:
      resources:
        limits:
          memory: 800M
